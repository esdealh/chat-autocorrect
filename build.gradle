plugins {
    id 'fabric-loom' version '1.13.3'
}

// Which Minecraft version to build for: ./gradlew build -Ptarget=1.21.11
// Each target has a file in versions/ with its Minecraft, mappings and Fabric API versions.
def target = project.findProperty('target') ?: '1.21.11'
def targetProps = new Properties()
file("versions/${target}.properties").withInputStream { targetProps.load(it) }
def v = { String key -> targetProps.getProperty(key) }

version = "${project.mod_version}+mc${target}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Mod Menu (optional integration)
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

// Shared code plus the small version-specific Compat class
sourceSets {
    main {
        java {
            srcDir "src/compat/${v('compat')}/java"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${v('minecraft_version')}"
    mappings "net.fabricmc:yarn:${v('yarn_mappings')}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${v('fabric_version')}"
    // Compile against Mod Menu's API without requiring it at runtime.
    // Its API (ModMenuApi / ConfigScreenFactory) is the same in every 1.21.x version.
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
}

processResources {
    def props = [version: project.version, mc_range: v('mc_range')]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
